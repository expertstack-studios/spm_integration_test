trigger: none
pr: none

# ============================================================
# XCFramework pipeline resource
#
# This pipeline will automatically run whenever the
# XCFramework pipeline succeeds on main or release.
# ============================================================

resources:
  pipelines:
    - pipeline: xcframeworkBuild
      source: '[iOS] Build and Deploy Secured Calls Voice SDK'
      trigger:
        branches:
          include:
            - main
            - release


# ============================================================
# Variables
# ============================================================

variables:

  # ----------------------------------------------------------
  # Azure DevOps
  # ----------------------------------------------------------

  # ----------------------------------------------------------
  # Triggering XCFramework build
  # ----------------------------------------------------------

  # Azure DevOps run/build ID of the XCFramework pipeline.
  sourceBuildId: $[ resources.pipeline.xcframeworkBuild.runID ]

  # Examples:
  # refs/heads/main
  # refs/heads/release
  xcframeworkSourceBranch: $[ resources.pipeline.xcframeworkBuild.sourceBranch ]

  # Build/run name from the XCFramework pipeline.
  xcframeworkBuildNumber: $[ resources.pipeline.xcframeworkBuild.runName ]


  # ----------------------------------------------------------
  # Branch rules
  # ----------------------------------------------------------

  # XCFramework built from this branch becomes a stable release.
  stableSourceBranch: 'refs/heads/release'

  # Package.swift lives here and is updated by this pipeline.
  packageManifestBranch: 'main'


  # ----------------------------------------------------------
  # GitHub
  # ----------------------------------------------------------

  githubOwner: 'expertstack-studios'

  githubRepository: 'spm_integration_test'

  # Name of Azure DevOps GitHub OAuth/PAT service connection.
  #
  # Example:
  # GitHub-SecuredCalls-Releases
  githubReleaseServiceConnection: 'github.com_expertstack-studios'


  # ----------------------------------------------------------
  # Swift Package
  # ----------------------------------------------------------

  sdkName: 'SecuredCallsVoiceSDK'

  binaryTargetName: 'SecuredCallsVoiceSDKBinary'

  zipName: 'SecuredCallsVoiceSDK.xcframework.zip'


  # ----------------------------------------------------------
  # Azure artifact
  # ----------------------------------------------------------

  artifactName: 'SDK-xcframework-$(sourceBuildId)'

  pipelineResourcePath: '$(Pipeline.Workspace)/xcframeworkBuild'

  artifactDownloadPath: '$(Pipeline.Workspace)/xcframework'



# ============================================================
# Stages
# ============================================================

stages:

- stage: PublishSPM
  displayName: 'Publish Swift Package'

  jobs:

  - job: Publish
    displayName: 'Publish SecuredCallsVoiceSDK'

    pool:
      vmImage: 'macos-latest'

    steps:


    # ========================================================
    # 1. Checkout GitHub SPM repository
    # ========================================================

    - checkout: self
      clean: true
      fetchDepth: 0
      fetchTags: true
      persistCredentials: true
      displayName: 'Checkout SPM repository'


    # ========================================================
    # 2. Checkout main branch containing Package.swift
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Fetching $(packageManifestBranch)..."

        git fetch origin "$(packageManifestBranch)" --tags

        git checkout -B \
          "$(packageManifestBranch)" \
          "origin/$(packageManifestBranch)"

        echo
        echo "Repository state:"
        git status --short --branch

      displayName: 'Checkout Package.swift branch'


    # ========================================================
    # 3. Validate triggering XCFramework build
    # ========================================================

    - bash: |
        set -euo pipefail

        BUILD_ID="$(sourceBuildId)"
        SOURCE_BRANCH="$(xcframeworkSourceBranch)"
        BUILD_NUMBER="$(xcframeworkBuildNumber)"

        echo "=============================================="
        echo "Triggering XCFramework build"
        echo "=============================================="
        echo "Build ID      : $BUILD_ID"
        echo "Build number  : $BUILD_NUMBER"
        echo "Source branch : $SOURCE_BRANCH"
        echo "=============================================="

        if [ -z "$BUILD_ID" ]; then
          echo "##vso[task.logissue type=error]XCFramework source Build ID is empty."
          exit 1
        fi

        if [ -z "$SOURCE_BRANCH" ]; then
          echo "##vso[task.logissue type=error]XCFramework source branch is empty."
          exit 1
        fi

        if [ "$SOURCE_BRANCH" != "refs/heads/main" ] && \
           [ "$SOURCE_BRANCH" != "refs/heads/release" ]; then

          echo "##vso[task.logissue type=error]Unsupported XCFramework source branch: $SOURCE_BRANCH"
          exit 1
        fi

      displayName: 'Validate XCFramework source build'


    # ========================================================
    # 4. Calculate next semantic version
    #
    # Example:
    #
    # Existing stable:
    #
    #   v1.0.1
    #
    # main build:
    #
    #   v1.0.2-rc.1
    #   v1.0.2-rc.2
    #
    # release build:
    #
    #   v1.0.2
    #
    # After that:
    #
    #   v1.0.3-rc.1
    #
    # ========================================================

    - bash: |
        set -euo pipefail

        git fetch origin --tags --force

        SOURCE_BRANCH="$(xcframeworkSourceBranch)"
        STABLE_BRANCH="$(stableSourceBranch)"

        echo "XCFramework source branch:"
        echo "$SOURCE_BRANCH"

        echo
        echo "Stable release branch:"
        echo "$STABLE_BRANCH"


        # ----------------------------------------------------
        # Find latest stable semantic version.
        #
        # Ignores:
        #
        # v1.0.2-rc.1
        # v1.0.2-beta.1
        #
        # Includes:
        #
        # v1.0.1
        # v1.1.0
        # ----------------------------------------------------

        LATEST_STABLE=$(
          git tag \
            --list 'v[1-9]*.[0-9]*.[0-9]*' \
            --sort=-v:refname \
          | grep -E '^v[1-9]+\.[0-9]+\.[0-9]+$' \
          | head -n 1 \
          || true
        )


        if [ -z "$LATEST_STABLE" ]; then
          echo "No stable Git tag found."
          LATEST_STABLE="v1.0.0"

        fi


        echo
        echo "Latest stable:"
        echo "$LATEST_STABLE"


        CURRENT_VERSION="${LATEST_STABLE#v}"

        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

        NEXT_PATCH=$((PATCH + 1))

        NEXT_BASE="${MAJOR}.${MINOR}.${NEXT_PATCH}"


        echo
        echo "Next version base:"
        echo "$NEXT_BASE"


        # ----------------------------------------------------
        # release branch -> stable release
        # ----------------------------------------------------

        if [ "$SOURCE_BRANCH" = "$STABLE_BRANCH" ]; then

          RELEASE_VERSION="$NEXT_BASE"

          RELEASE_TAG="v${RELEASE_VERSION}"

          IS_PRERELEASE="false"

          MAKE_LATEST="true"

          RELEASE_KIND="release"


        # ----------------------------------------------------
        # RC release
        # ----------------------------------------------------

        else

          LAST_RC=$(
            git tag \
              --list "v${NEXT_BASE}-rc.*" \
              --sort=-v:refname \
            | grep -E "^v${NEXT_BASE//./\\.}-rc\.[0-9]+$" \
            | head -n 1 \
            || true
          )


          if [ -z "$LAST_RC" ]; then

            NEXT_RC=1

          else

            LAST_RC_NUMBER="${LAST_RC##*.}"

            NEXT_RC=$((LAST_RC_NUMBER + 1))

          fi


          RELEASE_VERSION="${NEXT_BASE}-rc.${NEXT_RC}"

          RELEASE_TAG="v${RELEASE_VERSION}"

          IS_PRERELEASE="true"

          MAKE_LATEST="false"

          RELEASE_KIND="prerelease"

        fi


        echo
        echo "================================================"
        echo "Calculated SDK release"
        echo "================================================"
        echo "Source branch : $SOURCE_BRANCH"
        echo "Latest stable : $LATEST_STABLE"
        echo "Version       : $RELEASE_VERSION"
        echo "Tag           : $RELEASE_TAG"
        echo "Type          : $RELEASE_KIND"
        echo "Pre-release   : $IS_PRERELEASE"
        echo "================================================"


        echo "##vso[task.setvariable variable=releaseVersion]$RELEASE_VERSION"

        echo "##vso[task.setvariable variable=releaseTag]$RELEASE_TAG"

        echo "##vso[task.setvariable variable=isGitHubPreRelease]$IS_PRERELEASE"

        echo "##vso[task.setvariable variable=makeLatestRelease]$MAKE_LATEST"

        echo "##vso[task.setvariable variable=releaseKind]$RELEASE_KIND"

      displayName: 'Calculate SDK version'


    # ========================================================
    # 5. Verify calculated tag doesn't already exist
    # ========================================================

    - bash: |
        set -euo pipefail

        git fetch origin --tags

        if git rev-parse \
          "refs/tags/$(releaseTag)" \
          >/dev/null 2>&1
        then

          echo "##vso[task.logissue type=error]Tag $(releaseTag) already exists."

          exit 1

        fi

        echo "Tag $(releaseTag) is available."

      displayName: 'Verify release tag'


    # ========================================================
    # 6. Download artifacts from triggering XCFramework run
    #
    # Azure automatically downloads artifacts from the exact
    # pipeline resource run that triggered this pipeline.
    # ========================================================

    - download: xcframeworkBuild
      displayName: 'Download XCFramework pipeline artifacts'

    # ========================================================
    # 7. Locate exact XCFramework ZIP
    #
    # Expected structure:
    #
    # $(Pipeline.Workspace)/xcframeworkBuild/
    #   SDK-xcframework-12345/
    #     SecuredCallsVoiceSDK.xcframework.zip
    # ========================================================

    - bash: |
        set -euo pipefail

        SOURCE_ROOT="$(pipelineResourcePath)"

        EXPECTED_ARTIFACT="$(artifactName)"

        echo "Pipeline resource path:"
        echo "$SOURCE_ROOT"

        echo
        echo "Expected artifact:"
        echo "$EXPECTED_ARTIFACT"

        echo
        echo "Downloaded contents:"

        find "$SOURCE_ROOT" \
          -maxdepth 4 \
          -type f \
          -print


        ZIP=$(
          find "$SOURCE_ROOT/$EXPECTED_ARTIFACT" \
            -type f \
            -name "$(zipName)" \
            -print \
            -quit
        )


        if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then

          echo "##vso[task.logissue type=error]XCFramework ZIP was not found in $EXPECTED_ARTIFACT."

          exit 1

        fi


        mkdir -p "$(artifactDownloadPath)"


        cp \
          "$ZIP" \
          "$(artifactDownloadPath)/$(zipName)"


        echo
        echo "XCFramework copied to:"

        echo "$(artifactDownloadPath)/$(zipName)"


        echo
        ls -lh "$(artifactDownloadPath)/$(zipName)"

      displayName: 'Locate XCFramework artifact'

    # ========================================================
    # 8. Validate XCFramework ZIP
    # ========================================================

    - bash: |
        set -euo pipefail

        ZIP="$(artifactDownloadPath)/$(zipName)"

        if ! unzip -Z1 "$ZIP" \
          | grep -q '^SecuredCallsVoiceSDK\.xcframework/Info\.plist$'
        then

          echo "##vso[task.logissue type=error]Invalid XCFramework archive."

          echo
          echo "Expected:"
          echo "SecuredCallsVoiceSDK.xcframework/Info.plist"

          echo
          echo "Archive contents:"
          unzip -l "$ZIP"

          exit 1

        fi

        echo "XCFramework ZIP structure is valid."

      displayName: 'Validate XCFramework structure'


    # ========================================================
    # 9. Compute SwiftPM checksum
    # ========================================================

    - bash: |
        set -euo pipefail

        ZIP="$(artifactDownloadPath)/$(zipName)"

        CHECKSUM=$(swift package compute-checksum "$ZIP")

        if [ -z "$CHECKSUM" ]; then

          echo "##vso[task.logissue type=error]Failed to compute SwiftPM checksum."

          exit 1

        fi

        echo "SwiftPM checksum:"
        echo "$CHECKSUM"

        echo "##vso[task.setvariable variable=swiftPackageChecksum]$CHECKSUM"

      displayName: 'Compute SwiftPM checksum'


    # ========================================================
    # 10. Generate GitHub release asset URL
    #
    # IMPORTANT:
    # This must be a plain URL — no Markdown.
    # ========================================================

    - bash: |
        set -euo pipefail

        URL="https://github.com/$(githubOwner)/$(githubRepository)/releases/download/$(releaseTag)/$(zipName)"

        echo "SwiftPM binary URL:"
        echo "$URL"

        echo "##vso[task.setvariable variable=binaryDownloadUrl]$URL"

      displayName: 'Generate binary URL'


    # ========================================================
    # 11. Update Package.swift
    #
    # Supports either:
    #
    # path: "SDK/..."
    #
    # or an existing:
    #
    # url: "..."
    # checksum: "..."
    # ========================================================

    - bash: |
        set -euo pipefail

        python3 - <<'PYTHON'
        import os
        import pathlib
        import re
        import sys

        package_path = pathlib.Path("Package.swift")

        if not package_path.exists():
            print(
                "##vso[task.logissue type=error]"
                "Package.swift not found."
            )
            sys.exit(1)

        target_name = os.environ["BINARY_TARGET_NAME"]
        binary_url = os.environ["BINARY_DOWNLOAD_URL"]
        checksum = os.environ["SWIFT_PACKAGE_CHECKSUM"]

        original = package_path.read_text()

        pattern = re.compile(
            r'(?P<indent>[ \t]*)'
            r'\.binaryTarget\(\s*'
            r'name:\s*"'
            + re.escape(target_name)
            + r'"\s*,'
            r'.*?'
            r'\)',
            re.DOTALL
        )

        match = pattern.search(original)

        if not match:
            print(
                "##vso[task.logissue type=error]"
                f"Could not find binaryTarget '{target_name}' "
                "in Package.swift."
            )
            sys.exit(1)

        indent = match.group("indent")
        child_indent = indent + "    "

        replacement = (
            f'{indent}.binaryTarget(\n'
            f'{child_indent}name: "{target_name}",\n'
            f'{child_indent}url: "{binary_url}",\n'
            f'{child_indent}checksum: "{checksum}"\n'
            f'{indent})'
        )

        updated = (
            original[:match.start()]
            + replacement
            + original[match.end():]
        )

        package_path.write_text(updated)

        print(f"Updated binary target: {target_name}")
        print(f"URL: {binary_url}")
        print(f"Checksum: {checksum}")
        PYTHON

        echo
        echo "Updated Package.swift:"
        echo "------------------------------------------------"
        cat Package.swift
        echo "------------------------------------------------"

      env:
        BINARY_TARGET_NAME: $(binaryTargetName)
        BINARY_DOWNLOAD_URL: $(binaryDownloadUrl)
        SWIFT_PACKAGE_CHECKSUM: $(swiftPackageChecksum)

      displayName: 'Update Package.swift'


    # ========================================================
    # 12. Verify Package.swift values
    # ========================================================

    - bash: |
        set -euo pipefail

        grep -Fq \
          '$(binaryDownloadUrl)' \
          Package.swift

        grep -Fq \
          '$(swiftPackageChecksum)' \
          Package.swift

        echo "Package.swift URL and checksum verified."

      displayName: 'Verify Package.swift'


    # ========================================================
    # 13. Validate Swift manifest
    # ========================================================

    - bash: |
        set -euo pipefail

        swift package dump-package \
          > "$(Agent.TempDirectory)/package.json"

        echo "Package.swift parsed successfully."

      displayName: 'Validate Swift Package manifest'


    # ========================================================
    # 14. Review changes
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Package.swift changes:"
        echo

        git diff -- Package.swift

        if git diff --quiet -- Package.swift; then

          echo "##vso[task.logissue type=error]Package.swift did not change."

          exit 1

        fi

      displayName: 'Review Package.swift changes'


    # ========================================================
    # 15. Commit Package.swift
    # ========================================================

    - bash: |
        set -euo pipefail

        git config \
          user.name \
          "Azure DevOps"

        git config \
          user.email \
          "azure-pipelines@users.noreply.github.com"

        git add Package.swift

        git commit \
          -m "Release SecuredCallsVoiceSDK $(releaseVersion)"

        RELEASE_COMMIT=$(git rev-parse HEAD)

        echo
        echo "Release commit:"
        echo "$RELEASE_COMMIT"

        echo "##vso[task.setvariable variable=releaseCommit]$RELEASE_COMMIT"

      displayName: 'Commit Package.swift'

    # ========================================================
    # 16. Push Package.swift
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Pushing Package.swift to $(packageManifestBranch)..."

        git push \
          origin \
          HEAD:"$(packageManifestBranch)"

      displayName: 'Push Package.swift to GitHub'

    # ========================================================
    # 17. Verify pushed commit
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Expected release commit:"
        echo "$(releaseCommit)"

        REMOTE_MAIN=$(
          git ls-remote \
            origin \
            "refs/heads/$(packageManifestBranch)" \
          | awk '{print $1}'
        )

        echo "Expected commit : $(releaseCommit)"
        echo "Remote commit   : $REMOTE_MAIN"

        if [ "$REMOTE_MAIN" != "$(releaseCommit)" ]; then

          echo "##vso[task.logissue type=error]Remote branch does not point to release commit."

          exit 1

        fi

        echo "Remote release commit verified."

      displayName: 'Verify GitHub release commit'
    
    # ========================================================
    # 18. Create and push Git tag explicitly
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Creating Git tag:"
        echo "$(releaseTag)"

        git fetch origin "$(packageManifestBranch)" --tags


        REMOTE_COMMIT=$(
          git rev-parse "origin/$(packageManifestBranch)"
        )


        if [ "$REMOTE_COMMIT" != "$(releaseCommit)" ]; then

          echo "##vso[task.logissue type=error]Remote branch does not point to release commit."

          exit 1

        fi


        if git ls-remote \
          --exit-code \
          --tags \
          origin \
          "refs/tags/$(releaseTag)" \
          >/dev/null 2>&1
        then

          echo "##vso[task.logissue type=error]Tag $(releaseTag) already exists on GitHub."

          exit 1

        fi


        git tag \
          -a "$(releaseTag)" \
          "$(releaseCommit)" \
          -m "SecuredCallsVoiceSDK $(releaseVersion)"


        git push \
          origin \
          "refs/tags/$(releaseTag)"


        echo
        echo "Tag pushed successfully."

      displayName: 'Create and push Git tag'

    # ========================================================
    # 19. Verify GitHub tag
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Checking remote tag $(releaseTag)..."

        TAG_REF=$(
          git ls-remote \
            --tags \
            origin \
            "refs/tags/$(releaseTag)"
        )

        if [ -z "$TAG_REF" ]; then
          echo "##vso[task.logissue type=error]Tag $(releaseTag) was not found on GitHub."
          exit 1
        fi

        echo "Remote tag found:"
        echo "$TAG_REF"

      displayName: 'Verify GitHub tag'


    # ========================================================
    # 20. Create GitHub Release + upload XCFramework ZIP
    # ========================================================

    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'

      inputs:
        gitHubConnection: '$(githubReleaseServiceConnection)'
        repositoryName: '$(githubOwner)/$(githubRepository)'
        action: 'create'
        target: '$(packageManifestBranch)'
        tagSource: 'userSpecifiedTag'
        tag: '$(releaseTag)'
        title: 'SecuredCallsVoiceSDK $(releaseTag)'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          SecuredCallsVoiceSDK $(releaseTag)
          Release type:  $(releaseKind)
          XCFramework source branch: $(xcframeworkSourceBranch)
          Azure DevOps Build ID: $(sourceBuildId)
          Azure DevOps Build Number: $(xcframeworkBuildNumber)
          SwiftPM checksum: $(swiftPackageChecksum)

        assets: |
          $(artifactDownloadPath)/$(zipName)

        isDraft: false

        isPreRelease: $(isGitHubPreRelease)

        makeLatest: $(makeLatestRelease)

        addChangeLog: false


    # ========================================================
    # 21. Verify uploaded GitHub binary
    #
    # Suitable for a public GitHub repository/release asset.
    # ========================================================

    - bash: |
        set -euo pipefail

        URL="$(binaryDownloadUrl)"

        REMOTE_ZIP="$(Agent.TempDirectory)/published-$(zipName)"

        SUCCESS=false

        echo "Verifying published asset:"
        echo "$URL"

        for ATTEMPT in {1..10}; do

          echo "Attempt $ATTEMPT of 10..."

          if curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$URL" \
            --output "$REMOTE_ZIP"
          then

            SUCCESS=true
            break

          fi

          sleep 5

        done


        if [ "$SUCCESS" != "true" ]; then

          echo "##vso[task.logissue type=error]Unable to download published GitHub asset."

          exit 1

        fi


        ACTUAL_CHECKSUM=$(
          swift package compute-checksum "$REMOTE_ZIP"
        )


        echo
        echo "Expected checksum:"
        echo "$(swiftPackageChecksum)"

        echo
        echo "Published checksum:"
        echo "$ACTUAL_CHECKSUM"


        if [ "$ACTUAL_CHECKSUM" != "$(swiftPackageChecksum)" ]; then

          echo "##vso[task.logissue type=error]Published XCFramework checksum mismatch."

          exit 1

        fi


        echo
        echo "Published XCFramework verified successfully."

      displayName: 'Verify published XCFramework'


    # ========================================================
    # 22. Summary
    # ========================================================

    - bash: |
        echo
        echo "================================================"
        echo "SecuredCallsVoiceSDK published successfully"
        echo "================================================"
        echo
        echo "Azure Build ID : $(sourceBuildId)"
        echo "Source branch  : $(xcframeworkSourceBranch)"
        echo "Release type   : $(releaseKind)"
        echo "Version        : $(releaseVersion)"
        echo "Tag            : $(releaseTag)"
        echo "Pre-release    : $(isGitHubPreRelease)"
        echo
        echo "Binary:"
        echo "$(binaryDownloadUrl)"
        echo
        echo "Checksum:"
        echo "$(swiftPackageChecksum)"
        echo
        echo "================================================"

      displayName: 'Release summary'