trigger: none
pr: none

# ============================================================
# Runtime parameters
# ============================================================

parameters:
- name: sourceBuildId
  displayName: 'XCFramework Azure Build ID'
  type: string


# ============================================================
# Variables
# ============================================================

variables:

  # ----------------------------------------------------------
  # Azure DevOps
  # ----------------------------------------------------------

  # ID of the existing pipeline that builds:
  #
  # SecuredCallsVoiceSDK.xcframework.zip
  #
  # Example pipeline URL:
  # .../_build?definitionId=123
  #
  sourcePipelineDefinitionId: 'REPLACE_WITH_PIPELINE_DEFINITION_ID'


  # ----------------------------------------------------------
  # Branch rules
  # ----------------------------------------------------------

  # XCFramework built from this branch becomes a stable release.
  stableSourceBranch: 'refs/heads/release'

  # Package.swift lives here and is updated by this pipeline.
  packageManifestBranch: 'main'


  # ----------------------------------------------------------
  # GitHub
  # ----------------------------------------------------------

  githubOwner: 'REPLACE_WITH_GITHUB_ORG'

  githubRepository: 'ios-securevoicecall-sdk'

  # Name of Azure DevOps GitHub OAuth/PAT service connection.
  #
  # Example:
  # GitHub-SecuredCalls-Releases
  githubReleaseServiceConnection: 'REPLACE_WITH_GITHUB_SERVICE_CONNECTION'


  # ----------------------------------------------------------
  # Swift Package
  # ----------------------------------------------------------

  sdkName: 'SecuredCallsVoiceSDK'

  binaryTargetName: 'SecuredCallsVoiceSDKBinary'

  zipName: 'SecuredCallsVoiceSDK.xcframework.zip'


  # ----------------------------------------------------------
  # Azure artifact
  # ----------------------------------------------------------

  artifactName: 'SDK-xcframework-${{ parameters.sourceBuildId }}'

  artifactDownloadPath: '$(Pipeline.Workspace)/xcframework'



# ============================================================
# Stages
# ============================================================

stages:

- stage: PublishSPM
  displayName: 'Publish Swift Package'

  jobs:

  - job: Publish
    displayName: 'Publish SecuredCallsVoiceSDK'

    pool:
      vmImage: 'macos-latest'

    steps:


    # ========================================================
    # 1. Checkout GitHub SPM repository
    # ========================================================

    - checkout: self
      clean: true
      fetchDepth: 0
      fetchTags: true
      persistCredentials: true
      displayName: 'Checkout SPM repository'


    # ========================================================
    # 2. Checkout main branch containing Package.swift
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Fetching $(packageManifestBranch)..."

        git fetch origin "$(packageManifestBranch)" --tags

        git checkout -B \
          "$(packageManifestBranch)" \
          "origin/$(packageManifestBranch)"

        echo
        echo "Repository state:"
        git status --short --branch

      displayName: 'Checkout Package.swift branch'


    # ========================================================
    # 3. Validate selected Azure build and determine
    #    which branch produced the XCFramework
    #
    # This is important:
    #
    # We do NOT use Build.SourceBranch of this release pipeline.
    #
    # We query the Azure build selected by sourceBuildId.
    # ========================================================

    - bash: |
        set -euo pipefail

        BUILD_ID='${{ parameters.sourceBuildId }}'

        API_URL="$(System.CollectionUri)$(System.TeamProjectId)/_apis/build/builds/${BUILD_ID}?api-version=7.1"

        echo "Reading Azure build:"
        echo "$BUILD_ID"

        curl \
          --fail \
          --silent \
          --show-error \
          --header "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
          "$API_URL" \
          --output "$(Agent.TempDirectory)/source-build.json"

        python3 - <<'PYTHON'
        import json
        import os
        import sys

        path = os.path.join(
            os.environ["AGENT_TEMPDIRECTORY"],
            "source-build.json"
        )

        with open(path, "r") as f:
            build = json.load(f)

        expected_definition = int(
            os.environ["EXPECTED_PIPELINE_DEFINITION"]
        )

        actual_definition = build["definition"]["id"]
        build_id = build["id"]
        source_branch = build.get("sourceBranch", "")
        build_result = build.get("result", "")
        build_number = build.get("buildNumber", "")

        print(f"Build ID       : {build_id}")
        print(f"Build number   : {build_number}")
        print(f"Definition ID  : {actual_definition}")
        print(f"Source branch  : {source_branch}")
        print(f"Result         : {build_result}")

        if actual_definition != expected_definition:
            print(
                "##vso[task.logissue type=error]"
                f"Build {build_id} belongs to pipeline definition "
                f"{actual_definition}, expected {expected_definition}."
            )
            sys.exit(1)

        if build_result != "succeeded":
            print(
                "##vso[task.logissue type=error]"
                f"Source build result is '{build_result}', not succeeded."
            )
            sys.exit(1)

        if not source_branch:
            print(
                "##vso[task.logissue type=error]"
                "Could not determine source build branch."
            )
            sys.exit(1)

        print(
            f"##vso[task.setvariable variable=xcframeworkSourceBranch]"
            f"{source_branch}"
        )

        print(
            f"##vso[task.setvariable variable=xcframeworkBuildNumber]"
            f"{build_number}"
        )
        PYTHON

      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
        EXPECTED_PIPELINE_DEFINITION: $(sourcePipelineDefinitionId)

      displayName: 'Validate XCFramework source build'


    # ========================================================
    # 4. Calculate next semantic version
    #
    # Example:
    #
    # Existing stable:
    #
    #   v1.0.1
    #
    # main build:
    #
    #   v1.0.2-rc.1
    #   v1.0.2-rc.2
    #
    # release build:
    #
    #   v1.0.2
    #
    # After that:
    #
    #   v1.0.3-rc.1
    #
    # ========================================================

    - bash: |
        set -euo pipefail

        git fetch origin --tags --force

        SOURCE_BRANCH="$(xcframeworkSourceBranch)"
        STABLE_BRANCH="$(stableSourceBranch)"

        echo "XCFramework source branch:"
        echo "$SOURCE_BRANCH"

        echo
        echo "Stable release branch:"
        echo "$STABLE_BRANCH"


        # ----------------------------------------------------
        # Find latest STABLE semantic version.
        #
        # RC tags are excluded.
        #
        # Using Git's version-aware tag sorting avoids relying
        # on GNU sort -V, which may not be present on macOS.
        # ----------------------------------------------------

        LATEST_STABLE=$(
          git tag \
            --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-v:refname \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
          | head -n 1 \
          || true
        )


        if [ -z "$LATEST_STABLE" ]; then

          echo "No stable Git tag found."

          LATEST_STABLE="v0.0.0"

        fi


        echo
        echo "Latest stable:"
        echo "$LATEST_STABLE"


        CURRENT_VERSION="${LATEST_STABLE#v}"

        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

        NEXT_PATCH=$((PATCH + 1))

        NEXT_BASE="${MAJOR}.${MINOR}.${NEXT_PATCH}"


        echo
        echo "Next version base:"
        echo "$NEXT_BASE"


        # ----------------------------------------------------
        # Stable release
        # ----------------------------------------------------

        if [ "$SOURCE_BRANCH" = "$STABLE_BRANCH" ]; then

          RELEASE_VERSION="$NEXT_BASE"

          RELEASE_TAG="v${RELEASE_VERSION}"

          IS_PRERELEASE="false"

          MAKE_LATEST="true"

          RELEASE_KIND="release"


        # ----------------------------------------------------
        # RC release
        # ----------------------------------------------------

        else

          LAST_RC=$(
            git tag \
              --list "v${NEXT_BASE}-rc.*" \
              --sort=-v:refname \
            | grep -E "^v${NEXT_BASE//./\\.}-rc\.[0-9]+$" \
            | head -n 1 \
            || true
          )


          if [ -z "$LAST_RC" ]; then

            NEXT_RC=1

          else

            LAST_RC_NUMBER="${LAST_RC##*.}"

            NEXT_RC=$((LAST_RC_NUMBER + 1))

          fi


          RELEASE_VERSION="${NEXT_BASE}-rc.${NEXT_RC}"

          RELEASE_TAG="v${RELEASE_VERSION}"

          IS_PRERELEASE="true"

          MAKE_LATEST="false"

          RELEASE_KIND="prerelease"

        fi


        echo
        echo "================================================"
        echo "Calculated SDK release"
        echo "================================================"
        echo "Source branch : $SOURCE_BRANCH"
        echo "Latest stable : $LATEST_STABLE"
        echo "Version       : $RELEASE_VERSION"
        echo "Tag           : $RELEASE_TAG"
        echo "Type          : $RELEASE_KIND"
        echo "Pre-release   : $IS_PRERELEASE"
        echo "================================================"


        echo "##vso[task.setvariable variable=releaseVersion]$RELEASE_VERSION"

        echo "##vso[task.setvariable variable=releaseTag]$RELEASE_TAG"

        echo "##vso[task.setvariable variable=isGitHubPreRelease]$IS_PRERELEASE"

        echo "##vso[task.setvariable variable=makeLatestRelease]$MAKE_LATEST"

        echo "##vso[task.setvariable variable=releaseKind]$RELEASE_KIND"

      displayName: 'Calculate SDK version'


    # ========================================================
    # 5. Ensure tag doesn't already exist
    # ========================================================

    - bash: |
        set -euo pipefail

        git fetch origin --tags

        if git rev-parse \
          "refs/tags/$(releaseTag)" \
          >/dev/null 2>&1
        then

          echo "##vso[task.logissue type=error]Tag $(releaseTag) already exists."

          exit 1

        fi

        echo "Tag $(releaseTag) is available."

      displayName: 'Verify release tag'


    # ========================================================
    # 6. Download exact XCFramework artifact
    #
    # Artifact:
    #
    # SDK-xcframework-<BuildId>
    #
    # Example:
    #
    # SDK-xcframework-12345
    #
    # ========================================================

    - task: DownloadPipelineArtifact@2
      displayName: 'Download XCFramework artifact'

      inputs:
        buildType: 'specific'
        project: '$(System.TeamProject)'
        definition: '$(sourcePipelineDefinitionId)'
        buildVersionToDownload: 'specific'
        pipelineId: '${{ parameters.sourceBuildId }}'
        artifactName: '$(artifactName)'
        targetPath: '$(artifactDownloadPath)'


    # ========================================================
    # 7. Validate downloaded ZIP
    # ========================================================

    - bash: |
        set -euo pipefail

        ZIP="$(artifactDownloadPath)/$(zipName)"

        echo "Expected artifact:"
        echo "$ZIP"

        if [ ! -f "$ZIP" ]; then

          echo "##vso[task.logissue type=error]XCFramework ZIP not found."

          echo
          echo "Downloaded files:"

          find "$(artifactDownloadPath)" \
            -maxdepth 5 \
            -type f \
            -print || true

          exit 1

        fi

        echo
        echo "Artifact:"
        ls -lh "$ZIP"

      displayName: 'Validate XCFramework artifact'


    # ========================================================
    # 8. Validate XCFramework ZIP contents
    # ========================================================

    - bash: |
        set -euo pipefail

        ZIP="$(artifactDownloadPath)/$(zipName)"

        if ! unzip -Z1 "$ZIP" \
          | grep -q '^SecuredCallsVoiceSDK\.xcframework/Info\.plist$'
        then

          echo "##vso[task.logissue type=error]Invalid XCFramework archive."

          echo
          echo "Expected:"
          echo "SecuredCallsVoiceSDK.xcframework/Info.plist"

          echo
          echo "Archive contents:"
          unzip -l "$ZIP"

          exit 1

        fi

        echo "XCFramework ZIP structure is valid."

      displayName: 'Validate XCFramework structure'


    # ========================================================
    # 9. Compute SwiftPM checksum
    #
    # IMPORTANT:
    #
    # This is performed on the exact ZIP downloaded from the
    # Azure artifact.
    #
    # That same ZIP is uploaded to GitHub later.
    # ========================================================

    - bash: |
        set -euo pipefail

        ZIP="$(artifactDownloadPath)/$(zipName)"

        CHECKSUM=$(swift package compute-checksum "$ZIP")

        if [ -z "$CHECKSUM" ]; then

          echo "##vso[task.logissue type=error]Failed to compute SwiftPM checksum."

          exit 1

        fi

        echo "SwiftPM checksum:"
        echo "$CHECKSUM"

        echo "##vso[task.setvariable variable=swiftPackageChecksum]$CHECKSUM"

      displayName: 'Compute SwiftPM checksum'


    # ========================================================
    # 10. Generate GitHub binary URL
    # ========================================================

    - bash: |
        set -euo pipefail

        URL="https://github.com/$(githubOwner)/$(githubRepository)/releases/download/$(releaseTag)/$(zipName)"

        echo "SwiftPM binary URL:"
        echo "$URL"

        echo "##vso[task.setvariable variable=binaryDownloadUrl]$URL"

      displayName: 'Generate binary URL'


    # ========================================================
    # 11. Update Package.swift
    #
    # Handles BOTH:
    #
    # Initial state:
    #
    # .binaryTarget(
    #     name: "SecuredCallsVoiceSDKBinary",
    #     path: "SDK/SecuredCallsVoiceSDK.xcframework"
    # )
    #
    # AND subsequent releases:
    #
    # .binaryTarget(
    #     name: "SecuredCallsVoiceSDKBinary",
    #     url: "...",
    #     checksum: "..."
    # )
    #
    # Azure variables are passed as environment variables to
    # avoid YAML/Python parser problems.
    # ========================================================

    - bash: |
        set -euo pipefail

        python3 - <<'PYTHON'
        import os
        import pathlib
        import re
        import sys

        package_path = pathlib.Path("Package.swift")

        if not package_path.exists():
            print(
                "##vso[task.logissue type=error]"
                "Package.swift not found."
            )
            sys.exit(1)

        target_name = os.environ["BINARY_TARGET_NAME"]
        binary_url = os.environ["BINARY_DOWNLOAD_URL"]
        checksum = os.environ["SWIFT_PACKAGE_CHECKSUM"]

        original = package_path.read_text()

        pattern = re.compile(
            r'(?P<indent>[ \t]*)'
            r'\.binaryTarget\(\s*'
            r'name:\s*"'
            + re.escape(target_name)
            + r'"\s*,'
            r'.*?'
            r'\)',
            re.DOTALL
        )

        match = pattern.search(original)

        if not match:
            print(
                "##vso[task.logissue type=error]"
                f"Could not find binaryTarget '{target_name}' "
                "in Package.swift."
            )
            sys.exit(1)

        indent = match.group("indent")
        child_indent = indent + "    "

        replacement = (
            f'{indent}.binaryTarget(\n'
            f'{child_indent}name: "{target_name}",\n'
            f'{child_indent}url: "{binary_url}",\n'
            f'{child_indent}checksum: "{checksum}"\n'
            f'{indent})'
        )

        updated = (
            original[:match.start()]
            + replacement
            + original[match.end():]
        )

        package_path.write_text(updated)

        print(f"Updated binary target: {target_name}")
        print(f"URL: {binary_url}")
        print(f"Checksum: {checksum}")
        PYTHON

        echo
        echo "Updated Package.swift:"
        echo "------------------------------------------------"
        cat Package.swift
        echo "------------------------------------------------"

      env:
        BINARY_TARGET_NAME: $(binaryTargetName)
        BINARY_DOWNLOAD_URL: $(binaryDownloadUrl)
        SWIFT_PACKAGE_CHECKSUM: $(swiftPackageChecksum)

      displayName: 'Update Package.swift'


    # ========================================================
    # 12. Verify Package.swift values
    # ========================================================

    - bash: |
        set -euo pipefail

        grep -Fq \
          '$(binaryDownloadUrl)' \
          Package.swift

        grep -Fq \
          '$(swiftPackageChecksum)' \
          Package.swift

        echo "Package.swift URL and checksum verified."

      displayName: 'Verify Package.swift'


    # ========================================================
    # 13. Validate manifest syntax
    #
    # dump-package parses Package.swift without requiring us
    # to build the binary target.
    # ========================================================

    - bash: |
        set -euo pipefail

        swift package dump-package \
          > "$(Agent.TempDirectory)/package.json"

        echo "Package.swift parsed successfully."

      displayName: 'Validate Swift Package manifest'


    # ========================================================
    # 14. Show changes
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Package.swift changes:"
        echo

        git diff -- Package.swift

        if git diff --quiet -- Package.swift; then

          echo "##vso[task.logissue type=error]Package.swift did not change."

          exit 1

        fi

      displayName: 'Review Package.swift changes'


    # ========================================================
    # 15. Commit Package.swift
    # ========================================================

    - bash: |
        set -euo pipefail

        git config \
          user.name \
          "Azure DevOps"

        git config \
          user.email \
          "azure-pipelines@users.noreply.github.com"

        git add Package.swift

        git commit \
          -m "Release SecuredCallsVoiceSDK $(releaseVersion)"

        RELEASE_COMMIT=$(git rev-parse HEAD)

        echo
        echo "Release commit:"
        echo "$RELEASE_COMMIT"

        echo "##vso[task.setvariable variable=releaseCommit]$RELEASE_COMMIT"

      displayName: 'Commit Package.swift'


    # ========================================================
    # 16. Push Package.swift to GitHub
    #
    # persistCredentials:true from checkout is used here.
    #
    # NOTE:
    # This requires the Azure Pipelines identity to be allowed
    # to push to main.
    # ========================================================

    - bash: |
        set -euo pipefail

        echo "Pushing Package.swift to $(packageManifestBranch)..."

        git push \
          origin \
          HEAD:"$(packageManifestBranch)"

      displayName: 'Push Package.swift to GitHub'


    # ========================================================
    # 17. Create GitHub Release
    #
    # GitHubRelease@1 requires an OAuth/PAT GitHub service
    # connection.
    #
    # GitHubRelease@1 officially supports:
    #
    # isPreRelease
    # isDraft
    # makeLatest
    # assets
    #
    # ========================================================

    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'

      inputs:
        gitHubConnection: '$(githubReleaseServiceConnection)'
        repositoryName: '$(githubOwner)/$(githubRepository)'
        action: 'create'
        target: '$(releaseCommit)'
        tagSource: 'userSpecifiedTag'
        tag: '$(releaseTag)'
        title: 'SecuredCallsVoiceSDK $(releaseTag)'
        releaseNotesSource: 'inline'
        releaseNotesInline: |
          SecuredCallsVoiceSDK $(releaseTag)
          Release type:
          $(releaseKind)
          XCFramework source branch:
          $(xcframeworkSourceBranch)
          Azure DevOps Build ID:
          ${{ parameters.sourceBuildId }}

          Azure DevOps Build Number:
          $(xcframeworkBuildNumber)

          SwiftPM checksum:
          $(swiftPackageChecksum)

        assets: |
          $(artifactDownloadPath)/$(zipName)

        isDraft: false

        isPreRelease: $(isGitHubPreRelease)

        makeLatest: $(makeLatestRelease)

        addChangeLog: false


    # ========================================================
    # 18. Verify uploaded GitHub binary
    #
    # This works for PUBLIC GitHub release assets.
    #
    # If this repository is PRIVATE, this step needs an
    # authenticated GitHub API download instead.
    # ========================================================

    - bash: |
        set -euo pipefail

        URL="$(binaryDownloadUrl)"

        REMOTE_ZIP="$(Agent.TempDirectory)/published-$(zipName)"

        SUCCESS=false

        echo "Verifying published asset:"
        echo "$URL"

        for ATTEMPT in {1..10}; do

          echo "Attempt $ATTEMPT of 10..."

          if curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$URL" \
            --output "$REMOTE_ZIP"
          then

            SUCCESS=true
            break

          fi

          sleep 5

        done


        if [ "$SUCCESS" != "true" ]; then

          echo "##vso[task.logissue type=error]Unable to download published GitHub asset."

          exit 1

        fi


        ACTUAL_CHECKSUM=$(
          swift package compute-checksum "$REMOTE_ZIP"
        )


        echo
        echo "Expected checksum:"
        echo "$(swiftPackageChecksum)"

        echo
        echo "Published checksum:"
        echo "$ACTUAL_CHECKSUM"


        if [ "$ACTUAL_CHECKSUM" != "$(swiftPackageChecksum)" ]; then

          echo "##vso[task.logissue type=error]Published XCFramework checksum mismatch."

          exit 1

        fi


        echo
        echo "Published XCFramework verified successfully."

      displayName: 'Verify published XCFramework'


    # ========================================================
    # 19. Summary
    # ========================================================

    - bash: |
        echo
        echo "================================================"
        echo "SecuredCallsVoiceSDK published successfully"
        echo "================================================"
        echo
        echo "Azure Build ID : ${{ parameters.sourceBuildId }}"
        echo "Source branch  : $(xcframeworkSourceBranch)"
        echo "Release type   : $(releaseKind)"
        echo "Version        : $(releaseVersion)"
        echo "Tag            : $(releaseTag)"
        echo "Pre-release    : $(isGitHubPreRelease)"
        echo
        echo "Binary:"
        echo "$(binaryDownloadUrl)"
        echo
        echo "Checksum:"
        echo "$(swiftPackageChecksum)"
        echo
        echo "================================================"

      displayName: 'Release summary'